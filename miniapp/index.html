<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Clothing Feed</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            color: #fff;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;
        }


        #card {

            width: 100%;
            height: 100%;

            position: relative;

            overflow: hidden;
        }


        .product-card {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            position: relative;

            padding: 15px 15px 90px;

            animation-duration: 0.25s;
            animation-timing-function: ease-out;
            animation-fill-mode: both;
        }


        .animate-next {

            animation-name: slideNext;
        }


        .animate-prev {

            animation-name: slidePrev;
        }


        @keyframes slideNext {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes slidePrev {

            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .product-image {

            width: 100%;

            max-width: 520px;

            height: min(
                68vh,
                700px
            );

            margin: 0 auto;

            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #111;

            border-radius: 22px;

            overflow: hidden;
        }


        .product-image img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        .image-error {

            background: #151515;
        }


        .no-image {

            font-size: 70px;

            opacity: 0.5;
        }


        .counter {

            position: absolute;

            top: 14px;
            right: 14px;

            padding: 7px 11px;

            border-radius: 20px;

            background: rgba(
                0,
                0,
                0,
                0.65
            );

            backdrop-filter: blur(10px);

            font-size: 13px;

            color: #fff;
        }


        .product-info {

            width: 100%;

            max-width: 520px;

            margin: 14px auto 0;

            padding: 0 5px;
        }


        .product-brand {

            color: #aaa;

            font-size: 14px;

            margin-bottom: 4px;
        }


        .product-title {

            font-size: 20px;

            line-height: 1.25;

            font-weight: 650;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .product-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 12px;

            margin-top: 10px;
        }


        .product-price {

            font-size: 22px;

            font-weight: 750;
        }


        .product-rating {

            margin-top: 3px;

            font-size: 13px;

            color: #ccc;
        }


        .open-button {

            flex-shrink: 0;

            text-decoration: none;

            color: #000;

            background: #fff;

            padding: 11px 17px;

            border-radius: 999px;

            font-size: 14px;

            font-weight: 650;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }


        .open-button:active {

            transform: scale(0.94);

            opacity: 0.8;
        }


        .controls {

            position: fixed;

            right: 15px;

            bottom: 25px;

            z-index: 20;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .controls button {

            width: 48px;
            height: 48px;

            border: none;

            border-radius: 50%;

            background: rgba(
                35,
                35,
                35,
                0.85
            );

            color: #fff;

            font-size: 22px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition:
                transform 0.15s,
                background 0.15s;
        }


        .controls button:active {

            transform: scale(0.9);

            background: #333;
        }


        .empty {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;
        }


        .empty-icon {

            font-size: 60px;

            margin-bottom: 20px;
        }


        .empty-title {

            font-size: 22px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .empty-text {

            color: #999;

            font-size: 15px;

            line-height: 1.4;
        }


        @media (min-width: 700px) {

            .product-card {

                padding-bottom: 40px;
            }

            .product-image {

                height: 65vh;
            }

            .controls {

                right: 30px;
                bottom: 40px;
            }
        }


    </style>

</head>


<body>


    <div id="card">

        <div class="empty">

            <div class="empty-icon">
                🛍️
            </div>

            <div class="empty-title">
                Загрузка товаров...
            </div>

        </div>

    </div>


    <div class="controls">

        <button
            class="btn-prev"
            aria-label="Предыдущий товар"
        >
            ↑
        </button>

        <button
            class="btn-next"
            aria-label="Следующий товар"
        >
            ↓
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
