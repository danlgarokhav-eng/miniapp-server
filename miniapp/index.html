```html
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>StyleFlow</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #07070a;
            color: white;
        }

        body {
            position: relative;
        }


        /* =========================
           ANIMATED BACKGROUND
           ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    #19142e 0%,
                    #09090d 45%,
                    #050507 100%
                );
        }

        .blob {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.45;
            animation: float 12s ease-in-out infinite;
        }

        .blob.one {
            background: #743cff;
            top: -80px;
            left: -90px;
        }

        .blob.two {
            background: #ff287d;
            right: -100px;
            top: 25%;
            animation-delay: -4s;
        }

        .blob.three {
            background: #00b8ff;
            left: 20%;
            bottom: -150px;
            animation-delay: -8s;
        }

        @keyframes float {

            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }

            33% {
                transform: translate3d(35px, -30px, 0) scale(1.12);
            }

            66% {
                transform: translate3d(-25px, 35px, 0) scale(0.92);
            }

            100% {
                transform: translate3d(0, 0, 0) scale(1);
            }

        }


        /* =========================
           APP
           ========================= */

        .app {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           TOP BAR
           ========================= */

        .topbar {
            height: 70px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 800;
            font-size: 19px;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #8b5cff,
                    #ff3d9a
                );

            box-shadow:
                0 8px 30px rgba(139, 92, 255, 0.35);

            font-size: 17px;
        }

        .top-button {
            width: 40px;
            height: 40px;
            border-radius: 14px;

            border: 1px solid rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.07);

            backdrop-filter: blur(15px);

            color: white;
            font-size: 17px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           FEED
           ========================= */

        .feed-wrapper {
            flex: 1;
            min-height: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                5px
                14px
                14px;
        }

        .card {
            position: relative;

            width: 100%;
            max-width: 460px;

            height: 100%;

            border-radius: 28px;

            overflow: hidden;

            background:
                rgba(255,255,255,0.065);

            border:
                1px solid rgba(255,255,255,0.11);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45);

            backdrop-filter: blur(20px);

            transition:
                transform 0.35s ease,
                opacity 0.35s ease;
        }


        /* =========================
           MEDIA
           ========================= */

        .media {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.03),
                    rgba(0,0,0,0.35)
                );
        }

        .media img,
        .media video {
            width: 100%;
            height: 100%;

            object-fit: contain;

            background: rgba(0,0,0,0.12);
        }

        .media img {
            transition: transform 0.5s ease;
        }

        .card:hover .media img {
            transform: scale(1.025);
        }


        /* =========================
           DARK GRADIENT OVER IMAGE
           ========================= */

        .image-gradient {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.15) 0%,
                    transparent 35%,
                    rgba(0,0,0,0.2) 50%,
                    rgba(0,0,0,0.9) 100%
                );

            pointer-events: none;
        }


        /* =========================
           CARD INFO
           ========================= */

        .product-info {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 20px;

            z-index: 5;
        }

        .counter {
            display: inline-flex;

            padding: 7px 10px;

            border-radius: 12px;

            background:
                rgba(0,0,0,0.38);

            border:
                1px solid rgba(255,255,255,0.1);

            backdrop-filter: blur(12px);

            font-size: 12px;
            color: rgba(255,255,255,0.75);

            margin-bottom: 10px;
        }

        .brand {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.62);

            margin-bottom: 5px;
        }

        .title {
            font-size: 24px;
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -0.7px;

            margin-bottom: 9px;

            max-width: 90%;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 14px;
        }

        .price {
            font-size: 22px;
            font-weight: 800;
        }

        .rating {
            padding: 6px 9px;
            border-radius: 10px;

            background:
                rgba(255,255,255,0.1);

            font-size: 12px;
        }


        /* =========================
           OPEN BUTTON
           ========================= */

        .open-button {
            width: 100%;
            height: 48px;

            border: 0;
            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cff,
                    #ff3d9a
                );

            color: white;

            font-size: 15px;
            font-weight: 800;

            box-shadow:
                0 12px 30px rgba(139,92,255,0.28);

            transition:
                transform 0.15s ease,
                filter 0.15s ease;
        }

        .open-button:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }


        /* =========================
           SIDE ACTIONS
           ========================= */

        .side-actions {
            position: absolute;

            right: 12px;
            bottom: 155px;

            z-index: 10;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-button {
            width: 45px;
            height: 45px;

            border-radius: 15px;

            border:
                1px solid rgba(255,255,255,0.1);

            background:
                rgba(10,10,15,0.48);

            backdrop-filter: blur(15px);

            color: white;

            font-size: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .action-button:active {
            transform: scale(0.9);
        }


        /* =========================
           BOTTOM NAVIGATION
           ========================= */

        .bottom-nav {
            flex-shrink: 0;

            height: 76px;

            margin:
                0 12px
                12px;

            padding:
                7px 8px;

            border-radius: 22px;

            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            background:
                rgba(18,18,24,0.72);

            border:
                1px solid rgba(255,255,255,0.09);

            backdrop-filter:
                blur(25px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        .nav-item {
            border: 0;
            background: transparent;

            color:
                rgba(255,255,255,0.48);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 4px;

            border-radius: 17px;

            font-size: 11px;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .nav-icon {
            font-size: 19px;
            line-height: 1;
        }

        .nav-item.active {
            color: white;

            background:
                rgba(255,255,255,0.08);
        }


        /* =========================
           EMPTY / LOADING
           ========================= */

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;
            gap: 12px;

            background:
                rgba(5,5,8,0.5);

            backdrop-filter: blur(10px);

            z-index: 20;

            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .spinner {
            width: 28px;
            height: 28px;

            border:
                3px solid rgba(255,255,255,0.15);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================
           TOAST
           ========================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 98px;

            transform:
                translateX(-50%)
                translateY(20px);

            z-index: 100;

            padding:
                11px 16px;

            border-radius: 14px;

            background:
                rgba(20,20,25,0.9);

            border:
                1px solid rgba(255,255,255,0.1);

            backdrop-filter: blur(15px);

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;

            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =========================
           DESKTOP
           ========================= */

        @media (min-width: 700px) {

            .feed-wrapper {
                padding-bottom: 18px;
            }

            .card {
                max-width: 430px;
            }

            .bottom-nav {
                max-width: 430px;
                margin-left: auto;
                margin-right: auto;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BACKGROUND
         ========================= -->

    <div class="background">

        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="blob three"></div>

    </div>


    <!-- =========================
         APP
         ========================= -->

    <div class="app">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                StyleFlow

            </div>

            <button
                class="top-button"
                onclick="showToast('Поиск скоро будет доступен')"
            >
                🔍
            </button>

        </header>


        <!-- FEED -->

        <main class="feed-wrapper">

            <div
                id="card"
                class="card"
            >

                <div class="loading">

                    <div class="spinner"></div>

                    Загрузка товаров...

                </div>

            </div>

        </main>


        <!-- BOTTOM NAV -->

        <nav class="bottom-nav">

            <button
                class="nav-item active"
                onclick="switchTab(this, 'feed')"
            >

                <span class="nav-icon">
                    🏠
                </span>

                Лента

            </button>


            <button
                class="nav-item"
                onclick="switchTab(this, 'favorites')"
            >

                <span class="nav-icon">
                    ❤️
                </span>

                Избранное

            </button>


            <button
                class="nav-item"
                onclick="switchTab(this, 'cart')"
            >

                <span class="nav-icon">
                    🛒
                </span>

                Корзина

            </button>


            <button
                class="nav-item"
                onclick="switchTab(this, 'profile')"
            >

                <span class="nav-icon">
                    👤
                </span>

                Профиль

            </button>

        </nav>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script src="/script.js"></script>

</body>

</html>
```
