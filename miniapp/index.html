<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>StyleFlow</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #050505;
            color: white;
        }

        body {
            touch-action: none;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(100, 50, 255, .18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(255, 40, 130, .14),
                    transparent 35%
                ),
                #050505;

            z-index: 0;
        }

        .blob {
            position: absolute;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            filter: blur(90px);

            opacity: .28;

            animation:
                float 12s infinite alternate ease-in-out;
        }

        .blob.one {
            background: #7b2cff;
            top: -100px;
            left: -100px;
        }

        .blob.two {
            background: #ff176d;
            right: -120px;
            bottom: 20%;
            animation-delay: -4s;
        }

        .blob.three {
            background: #00b7ff;
            left: 30%;
            bottom: -180px;
            animation-delay: -8s;
        }

        @keyframes float {

            from {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate3d(80px, -50px, 0)
                    scale(1.2);
            }
        }


        /* =========================
           APP
        ========================= */

        .app {
            position: relative;

            width: 100%;
            height: 100%;

            z-index: 1;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 70px;

            padding:
                max(14px, env(safe-area-inset-top))
                18px
                10px
                18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 20;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.5),
                    transparent
                );
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 19px;
            font-weight: 800;

            letter-spacing: -.5px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #ff2f92,
                    #773cff
                );

            box-shadow:
                0 5px 25px rgba(150,60,255,.35);
        }

        .top-button {
            width: 40px;
            height: 40px;

            border: 0;
            border-radius: 50%;

            color: white;

            background:
                rgba(255,255,255,.10);

            backdrop-filter: blur(15px);

            font-size: 18px;

            cursor: pointer;
        }


        /* =========================
           FEED
        ========================= */

        .feed {
            position: absolute;

            inset: 0;

            overflow: hidden;
        }

        .card {
            position: absolute;

            inset:
                68px
                10px
                84px
                10px;

            border-radius: 27px;

            overflow: hidden;

            background:
                rgba(20,20,24,.78);

            border:
                1px solid rgba(255,255,255,.10);

            box-shadow:
                0 25px 80px rgba(0,0,0,.55);

            backdrop-filter: blur(18px);

            will-change:
                transform,
                opacity;

            transition:
                transform .35s cubic-bezier(.22,.61,.36,1),
                opacity .35s ease;

            user-select: none;
        }


        /* =========================
           IMAGE
        ========================= */

        .product-media {
            position: absolute;

            inset: 0;

            background: #111;
        }

        .product-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            user-select: none;

            pointer-events: none;
        }

        .product-media::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.18),
                    transparent 35%,
                    rgba(0,0,0,.9) 100%
                );
        }

        .no-image {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 70px;

            background:
                linear-gradient(
                    135deg,
                    #181818,
                    #303030
                );
        }


        /* =========================
           PRODUCT INFO
        ========================= */

        .product-info {
            position: absolute;

            left: 20px;
            right: 82px;
            bottom: 22px;

            z-index: 5;
        }

        .product-counter {
            position: absolute;

            right: -62px;
            bottom: 4px;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;

            background:
                rgba(0,0,0,.38);

            color:
                rgba(255,255,255,.7);

            backdrop-filter: blur(10px);
        }

        .product-brand {
            margin-bottom: 6px;

            color:
                rgba(255,255,255,.68);

            font-size: 13px;
            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .product-title {
            margin: 0 0 8px;

            font-size:
                clamp(22px, 6vw, 34px);

            line-height: 1.05;

            font-weight: 800;

            letter-spacing: -.7px;

            text-shadow:
                0 3px 15px rgba(0,0,0,.5);
        }

        .product-rating {
            display: inline-flex;

            padding: 6px 10px;

            margin-bottom: 11px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.12);

            backdrop-filter: blur(10px);

            font-size: 13px;
        }

        .product-price {
            font-size: 27px;
            font-weight: 850;

            letter-spacing: -.7px;
        }


        /* =========================
           OPEN PRODUCT
        ========================= */

        .open-product {
            width: 100%;

            margin-top: 13px;

            padding: 14px 18px;

            border: 0;
            border-radius: 16px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff2f92,
                    #713bff
                );

            font-size: 15px;
            font-weight: 800;

            box-shadow:
                0 10px 30px rgba(111,50,255,.28);

            cursor: pointer;
        }

        .open-product:active {
            transform: scale(.97);
        }


        /* =========================
           RIGHT ACTIONS
        ========================= */

        .actions {
            position: absolute;

            right: 13px;
            bottom: 150px;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 17px;

            z-index: 10;
        }

        .action {
            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 4px;

            border: 0;

            background: transparent;

            color: white;

            cursor: pointer;
        }

        .action-icon {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;

            background:
                rgba(0,0,0,.38);

            border:
                1px solid rgba(255,255,255,.12);

            backdrop-filter: blur(14px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.25);

            transition:
                transform .2s ease;
        }

        .action:active .action-icon {
            transform: scale(.84);
        }

        .action-label {
            font-size: 10px;

            color:
                rgba(255,255,255,.8);
        }

        .action.like.active .action-icon {
            background:
                rgba(255,45,110,.22);

            color: #ff3b78;
        }


        /* =========================
           LIKE ANIMATION
        ========================= */

        .big-heart {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(.2);

            font-size: 110px;

            opacity: 0;

            pointer-events: none;

            z-index: 30;

            filter:
                drop-shadow(
                    0 8px 25px
                    rgba(255,40,110,.45)
                );
        }

        .big-heart.show {
            animation:
                heartPop .7s ease forwards;
        }

        @keyframes heartPop {

            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(.2);
            }

            25% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.25);
            }

            65% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(1.35);
            }
        }


        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: absolute;

            left: 10px;
            right: 10px;
            bottom: 9px;

            height: 66px;

            padding:
                5px
                8px
                max(5px, env(safe-area-inset-bottom));

            display: flex;

            align-items: center;
            justify-content: space-around;

            border:
                1px solid rgba(255,255,255,.09);

            border-radius: 22px;

            background:
                rgba(18,18,22,.78);

            backdrop-filter: blur(22px);

            z-index: 20;
        }

        .nav-item {
            flex: 1;

            height: 55px;

            border: 0;

            border-radius: 16px;

            background: transparent;

            color:
                rgba(255,255,255,.48);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 3px;

            cursor: pointer;

            transition:
                .2s ease;
        }

        .nav-item span {
            font-size: 19px;
        }

        .nav-item small {
            font-size: 9px;
        }

        .nav-item.active {
            color: white;

            background:
                rgba(255,255,255,.08);
        }


        /* =========================
           COMMENTS
        ========================= */

        .comments-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.55);

            opacity: 0;
            pointer-events: none;

            transition: opacity .25s ease;

            z-index: 50;
        }

        .comments-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .comments {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 67%;

            border-radius:
                28px 28px 0 0;

            background:
                #151518;

            transform:
                translateY(100%);

            transition:
                transform .35s
                cubic-bezier(.22,.61,.36,1);

            padding: 18px;

            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        .comments-overlay.show .comments {
            transform:
                translateY(0);
        }

        .comments-head {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 15px;
        }

        .comments-title {
            font-size: 20px;
            font-weight: 800;
        }

        .close-comments {
            width: 38px;
            height: 38px;

            border: 0;

            border-radius: 50%;

            color: white;

            background:
                rgba(255,255,255,.09);

            font-size: 18px;
        }

        .comments-list {
            overflow-y: auto;

            flex: 1;

            padding-bottom: 20px;
        }

        .comment {
            padding: 14px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .comment-user {
            font-weight: 700;

            margin-bottom: 4px;
        }

        .comment-text {
            color:
                rgba(255,255,255,.72);

            line-height: 1.4;

            font-size: 14px;
        }

        .comment-date {
            margin-top: 5px;

            color:
                rgba(255,255,255,.35);

            font-size: 11px;
        }


        /* =========================
           FAVORITES
        ========================= */

        .favorites-screen {
            position: absolute;

            inset: 0;

            z-index: 15;

            display: none;

            padding:
                82px
                15px
                88px;

            overflow-y: auto;
        }

        .favorites-screen.show {
            display: block;
        }

        .favorites-header {
            margin-bottom: 18px;
        }

        .favorites-header h2 {
            margin: 0;

            font-size: 28px;
        }

        .favorites-header p {
            margin: 5px 0 0;

            color:
                rgba(255,255,255,.5);
        }

        .favorites-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 11px;
        }

        .favorite-card {
            min-width: 0;

            overflow: hidden;

            border-radius: 17px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid
                rgba(255,255,255,.08);

            cursor: pointer;
        }

        .favorite-card img {
            width: 100%;

            aspect-ratio: .78;

            object-fit: cover;

            display: block;
        }

        .favorite-card-info {
            padding: 9px;
        }

        .favorite-card-name {
            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            font-size: 13px;
            font-weight: 700;
        }

        .favorite-card-price {
            margin-top: 5px;

            font-weight: 800;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            position: absolute;

            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        .empty-icon {
            font-size: 60px;

            margin-bottom: 15px;
        }

        .empty-state h2 {
            margin: 0 0 7px;
        }

        .empty-state p {
            margin: 0;

            color:
                rgba(255,255,255,.55);
        }


        /* =========================
           TOAST
        ========================= */

        #toast {
            position: fixed;

            left: 50%;
            bottom: 91px;

            transform:
                translate(-50%, 20px);

            padding:
                11px 17px;

            border-radius: 30px;

            background:
                rgba(20,20,22,.9);

            border:
                1px solid
                rgba(255,255,255,.1);

            backdrop-filter: blur(15px);

            color: white;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            z-index: 100;

            transition:
                .25s ease;
        }

        #toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .card {
                width: 430px;

                left: 50%;
                right: auto;

                transform:
                    translateX(-50%);
            }

            .actions {
                right:
                    calc(50% - 265px);
            }

            .bottom-nav {
                width: 430px;

                left: 50%;
                right: auto;

                transform:
                    translateX(-50%);
            }

            .favorites-screen {
                width: 650px;

                left: 50%;
                right: auto;

                transform:
                    translateX(-50%);
            }

        }

    </style>
</head>


<body>

    <!-- =========================
         BACKGROUND
    ========================= -->

    <div class="background">

        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="blob three"></div>

    </div>


    <!-- =========================
         APP
    ========================= -->

    <div class="app">


        <!-- TOP -->

        <header class="topbar">

            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                StyleFlow

            </div>

            <button
                class="top-button"
                onclick="showToast('🔎 Поиск скоро появится')"
            >
                🔎
            </button>

        </header>


        <!-- FEED -->

        <main
            class="feed"
            id="feed"
        >

            <div
                class="card"
                id="card"
            >
            </div>


            <!-- ACTIONS -->

            <div class="actions">

                <button
                    class="action like"
                    id="likeButton"
                    onclick="toggleFavorite(event)"
                >

                    <div class="action-icon">
                        ♡
                    </div>

                    <span class="action-label">
                        Нравится
                    </span>

                </button>


                <button
                    class="action"
                    onclick="openComments()"
                >

                    <div class="action-icon">
                        💬
                    </div>

                    <span class="action-label">
                        Отзывы
                    </span>

                </button>


                <button
                    class="action"
                    onclick="shareProduct(event)"
                >

                    <div class="action-icon">
                        ↗
                    </div>

                    <span class="action-label">
                        Поделиться
                    </span>

                </button>

            </div>


            <!-- HEART -->

            <div
                class="big-heart"
                id="bigHeart"
            >
                ❤️
            </div>

        </main>


        <!-- FAVORITES -->

        <section
            class="favorites-screen"
            id="favoritesScreen"
        >

            <div class="favorites-header">

                <h2>
                    ❤️ Избранное
                </h2>

                <p id="favoritesCount">
                    Сохранённые товары
                </p>

            </div>

            <div
                class="favorites-grid"
                id="favoritesGrid"
            >
            </div>

        </section>


        <!-- NAV -->

        <nav class="bottom-nav">

            <button
                class="nav-item active"
                onclick="switchTab(this, 'feed')"
            >

                <span>⌂</span>

                <small>
                    Лента
                </small>

            </button>


            <button
                class="nav-item"
                onclick="switchTab(this, 'favorites')"
            >

                <span>♡</span>

                <small>
                    Избранное
                </small>

            </button>


            <button
                class="nav-item"
                onclick="showToast('🔎 Поиск скоро появится')"
            >

                <span>⌕</span>

                <small>
                    Поиск
                </small>

            </button>


            <button
                class="nav-item"
                onclick="showProfile()"
            >

                <span>○</span>

                <small>
                    Профиль
                </small>

            </button>

        </nav>

    </div>


    <!-- =========================
         COMMENTS
    ========================= -->

    <div
        class="comments-overlay"
        id="commentsOverlay"
        onclick="closeComments(event)"
    >

        <div
            class="comments"
            onclick="event.stopPropagation()"
        >

            <div class="comments-head">

                <div class="comments-title">
                    Отзывы
                </div>

                <button
                    class="close-comments"
                    onclick="closeComments()"
                >
                    ✕
                </button>

            </div>


            <div
                class="comments-list"
                id="commentsList"
            >
            </div>

        </div>

    </div>


    <script src="/script.js"></script>

</body>
</html>
